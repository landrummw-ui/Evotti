<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evotti · Retail Registration Data (InfoLink)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f7d8f'/><text x='16' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='21' font-weight='700' fill='%23ffffff' text-anchor='middle'>E</text></svg>">
<link rel="stylesheet" href="../sales/styles.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="lockup" href="../" title="Back to Evotti Apps">
    <img src="../assets/evotti-logo-black.png" alt="Evotti">
    <span class="rule"></span>
    <span class="sub">Market Intel</span>
  </a>
  <nav class="nav">
    <a href="#" class="active">Pontoon</a>
  </nav>
  <div class="topbar-right">
    <span class="asof" id="asof">&nbsp;</span>
  </div>
</header>

<div class="page-head">
  <h1>Retail Registrations — Pontoon</h1>
  <span class="sub" id="range">&nbsp;</span>
</div>

<!-- Collapsed rail — click to open the market agent -->
<button class="ask-rail" id="ask-open" aria-controls="ask-drawer" aria-expanded="false" title="Ask the market">
  <span class="spark"></span>
  <span class="ask-rail-label">Ask the market</span>
</button>

<!-- Off-canvas agent drawer -->
<aside class="ask-drawer" id="ask-drawer" aria-hidden="true" aria-label="Ask the market">
  <section class="card agent">
    <div class="card-head">
      <h2><span class="spark"></span> Ask the market</h2>
      <span class="spacer"></span>
      <button class="iconbtn" id="ask-close" title="Collapse" aria-label="Collapse">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="ask-row">
      <input id="ask" type="text" autocomplete="off"
             placeholder="Ask about share, a competitor, who's gaining…">
      <button class="btn primary" id="ask-go">Ask</button>
    </div>
    <div class="guide">
      <div class="guide-head"><span>Try asking</span></div>
      <div class="suggests" id="suggests"></div>
    </div>
  </section>
</aside>
<div class="ask-scrim" id="ask-scrim" hidden></div>

<div class="layout">
  <main class="main">

    <div id="answer"></div>

    <!-- Evotti spotlight -->
    <section class="card spotlight" id="spotlight"></section>

    <section class="kpis" id="kpis"></section>

    <section class="card">
      <div class="card-head">
        <h2>Market share trend — top makes</h2>
        <span class="spacer"></span>
        <button class="iconbtn" data-max="trend" title="Expand" aria-label="Expand">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </div>
      <p class="cap" id="trend-cap">&nbsp;</p>
      <div id="trend"></div>
      <div class="legend" id="trend-legend"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Where pontoons register — U.S. map</h2>
      </div>
      <p class="cap" id="usmap-cap">New pontoon registrations by state · pick a trailing-12-month period</p>
      <div id="usmap"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Manufacturer leaderboard</h2>
        <span class="spacer"></span>
        <button class="btn sm" id="toggle-all">Show all</button>
        <button class="btn sm" id="export">Export CSV</button>
      </div>
      <p class="cap" id="board-cap">&nbsp;</p>
      <div class="tbl-wrap"><table class="tbl" id="board"></table></div>
    </section>

  </main>
</div>

<!-- Expand / maximize -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <span class="spacer"></span>
      <button class="btn sm" id="modal-close">Close</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="market.js"></script>
<script src="../sales/charts.js"></script>
<script src="app.js"></script>
<script src="geo-data.js"></script>
<script src="usmap-geo.js"></script>
<script src="geo.js"></script>
</body>
</html>
